<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF 座標擷取工具</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #4f7ef7;
      --primary-dark: #3a63d8;
      --bg: #11131a;
      --surface: #191c27;
      --surface2: #21263a;
      --surface3: #2a3050;
      --text: #dde2f0;
      --text-muted: #7a82a8;
      --success: #3dba6e;
      --warn: #f5a623;
      --info: #2196f3;
      --danger: #e05555;
      --border: #2d3355;
      --radius: 8px;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text);
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }

    /* ── Header ── */
    header {
      display: flex; align-items: center; gap: .75rem;
      padding: .75rem 1.5rem;
      background: var(--surface); border-bottom: 1px solid var(--border);
      flex-shrink: 0; z-index: 10;
    }
    header svg { color: var(--primary); flex-shrink: 0; }
    header h1 { font-size: 1.1rem; font-weight: 700; }
    header .subtitle { font-size: .72rem; color: var(--text-muted); margin-top: 1px; }

    .layout { display: flex; flex: 1; overflow: hidden; }

    /* ── Sidebar ── */
    .sidebar {
      width: 300px; flex-shrink: 0;
      background: var(--surface); border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      overflow-y: auto; padding: 1rem; gap: 1.25rem;
    }

    .section-label {
      font-size: .65rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .12em; color: var(--text-muted); margin-bottom: .5rem;
    }

    /* divider */
    .divider {
      border: none; border-top: 1px solid var(--border); margin: .1rem 0;
    }

    /* Upload zone */
    .upload-zone {
      border: 2px dashed var(--border); border-radius: var(--radius);
      padding: 1.5rem 1rem; text-align: center; cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    .upload-zone:hover, .upload-zone.drag-over {
      border-color: var(--primary); background: rgba(79,126,247,.06);
    }
    .upload-zone input[type="file"] { display: none; }
    .upload-icon { font-size: 2rem; line-height: 1; margin-bottom: .4rem; }
    .upload-zone p { font-size: .8rem; color: var(--text-muted); }
    .upload-zone p strong { color: var(--text); }

    /* File badge */
    .file-badge {
      display: none; align-items: center; gap: .6rem;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: .6rem .75rem; font-size: .8rem;
    }
    .file-badge.visible { display: flex; }
    .file-badge .fname {
      font-weight: 600; color: var(--primary); flex: 1;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .file-badge .fsize { color: var(--text-muted); flex-shrink: 0; font-size: .72rem; }

    /* Options */
    .opts { display: flex; flex-direction: column; gap: .6rem; }
    .opt-row {
      display: flex; align-items: center;
      justify-content: space-between; gap: .5rem; font-size: .82rem;
    }
    .opt-row label { color: var(--text-muted); }

    .radio-group {
      display: flex; gap: .75rem; background: var(--surface2);
      border-radius: 6px; padding: .2rem;
    }
    .radio-group label {
      display: flex; align-items: center; gap: .35rem;
      font-size: .8rem; padding: .3rem .6rem; border-radius: 5px;
      cursor: pointer; transition: background .15s; color: var(--text-muted);
    }
    .radio-group input[type="radio"] { accent-color: var(--primary); }
    .radio-group label:has(input:checked) { background: var(--surface3); color: var(--text); }

    input[type="number"] {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 5px; color: var(--text);
      padding: .3rem .5rem; font-size: .82rem; width: 72px; text-align: center;
    }
    input[type="number"]:focus { outline: 1px solid var(--primary); }

    input[type="text"] {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 5px; color: var(--text);
      padding: .3rem .5rem; font-size: .82rem; width: 100%;
    }
    input[type="text"]::placeholder { color: var(--text-muted); }
    input[type="text"]:focus { outline: 1px solid var(--primary); }

    input[type="range"] { accent-color: var(--primary); flex: 1; cursor: pointer; }

    /* Buttons */
    .btn {
      border: none; border-radius: var(--radius); cursor: pointer;
      font-size: .85rem; font-weight: 600; padding: .55rem 1rem;
      transition: opacity .15s, transform .1s;
      display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
    }
    .btn:active:not(:disabled) { transform: scale(.96); }
    .btn:disabled { opacity: .35; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #fff; width: 100%; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
    .btn-success { background: var(--success); color: #fff; flex: 1; }
    .btn-info    { background: var(--info);    color: #fff; flex: 1; }
    .btn-success:hover:not(:disabled),
    .btn-info:hover:not(:disabled)    { opacity: .85; }
    .btn-row { display: flex; gap: .5rem; }

    /* Toggle switch button */
    .toggle-btn {
      display: flex; align-items: center; gap: .6rem;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: .45rem .75rem;
      cursor: pointer; font-size: .82rem; color: var(--text-muted);
      transition: border-color .15s, background .15s, color .15s; width: 100%;
    }
    .toggle-btn.active {
      border-color: var(--primary); color: var(--text);
      background: rgba(79,126,247,.1);
    }
    .sw-track {
      width: 28px; height: 16px; border-radius: 8px;
      background: var(--border); position: relative; flex-shrink: 0;
      transition: background .2s;
    }
    .toggle-btn.active .sw-track { background: var(--primary); }
    .sw-track::after {
      content: ''; width: 12px; height: 12px; border-radius: 50%;
      background: #fff; position: absolute; top: 2px; left: 2px;
      transition: transform .2s;
    }
    .toggle-btn.active .sw-track::after { transform: translateX(12px); }

    /* Small upload button */
    .btn-sm {
      border: none; border-radius: 6px; cursor: pointer;
      font-size: .78rem; font-weight: 600; padding: .35rem .7rem;
      background: var(--surface3); color: var(--text-muted);
      transition: color .15s, background .15s;
    }
    .btn-sm:hover { background: var(--primary); color: #fff; }
    .btn-sm input[type="file"] { display: none; }

    /* Progress */
    .progress-block { display: none; }
    .progress-block.visible { display: block; }
    .progress-bg {
      background: var(--surface2); border-radius: 4px;
      height: 7px; overflow: hidden; margin-top: .4rem;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), #7ba7ff);
      border-radius: 4px; transition: width .25s ease; width: 0%;
    }
    .progress-txt { font-size: .72rem; color: var(--text-muted); margin-top: .3rem; }

    /* Stats card */
    .stats-card {
      display: none; background: var(--surface2);
      border: 1px solid var(--border); border-radius: var(--radius); padding: .75rem;
    }
    .stats-card.visible { display: block; }
    .stat-row {
      display: flex; justify-content: space-between; align-items: center;
      font-size: .8rem; padding: .25rem 0; border-bottom: 1px solid var(--border);
    }
    .stat-row:last-child { border-bottom: none; }
    .stat-val { font-weight: 700; color: var(--primary); }

    /* Verify section */
    .verify-section { display: none; flex-direction: column; gap: .65rem; }
    .verify-section.visible { display: flex; }

    /* Color legend */
    .legend { display: flex; gap: .75rem; flex-wrap: wrap; }
    .chip {
      display: inline-flex; align-items: center; gap: .3rem;
      font-size: .7rem; color: var(--text-muted);
    }
    .chip-dot { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }

    /* Hover info panel */
    .hover-info {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: .6rem .75rem;
      font-family: 'Cascadia Code', Consolas, monospace;
      font-size: .7rem; color: var(--text-muted);
      min-height: 5.5rem; white-space: pre-wrap; line-height: 1.6;
    }

    /* Log */
    .log-box {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: .6rem .75rem;
      font-family: 'Cascadia Code', Consolas, monospace;
      font-size: .7rem; max-height: 130px; overflow-y: auto;
      color: var(--text-muted); flex-shrink: 0;
    }
    .log-line { padding: 1px 0; line-height: 1.5; }
    .log-line.ok  { color: var(--success); }
    .log-line.err { color: var(--danger); }
    .log-line.hi  { color: var(--primary); }

    /* ── Preview area ── */
    .preview-area {
      flex: 1; overflow-y: auto; background: #0a0c12;
      display: flex; flex-direction: column;
      align-items: center; padding: 2rem; gap: 2rem;
    }

    .empty-state {
      display: flex; flex-direction: column; align-items: center;
      gap: 1rem; margin-top: 6rem; color: var(--text-muted); text-align: center;
    }
    .empty-state svg { opacity: .2; }
    .empty-state p { font-size: .85rem; }

    /* Page wrapper */
    .page-block { display: flex; flex-direction: column; align-items: center; gap: .4rem; }
    .page-wrap  {
      position: relative; display: inline-block;
      box-shadow: 0 8px 32px rgba(0,0,0,.6); border-radius: 2px;
    }
    .page-wrap canvas { display: block; }
    .page-lbl { font-size: .7rem; color: var(--text-muted); }

    /* PDF.js text layer */
    .textLayer {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; overflow: hidden;
      line-height: 1; opacity: 1; pointer-events: none;
    }
    .textLayer span, .textLayer br {
      color: transparent; position: absolute;
      white-space: pre; cursor: text; transform-origin: 0% 0%;
    }

    /* Overlay canvas (sits on top of PDF + text layer) */
    .overlay-canvas {
      position: absolute; top: 0; left: 0;
      pointer-events: none; display: none;
    }
    .overlay-canvas.visible { display: block; }

    /* Hit-test div (captures mouse for the page) */
    .hit-div {
      position: absolute; inset: 0;
      z-index: 10; cursor: default;
    }
    .hit-div.active { cursor: crosshair; }

    /* Tooltip */
    #vTooltip {
      position: fixed; z-index: 9999;
      background: #1e2235; border: 1px solid var(--primary);
      border-radius: 6px; padding: .4rem .65rem;
      font-size: .74rem; font-family: Consolas, monospace;
      color: var(--text); pointer-events: none; display: none;
      max-width: 260px; line-height: 1.5;
      box-shadow: 0 4px 16px rgba(0,0,0,.6);
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
  </style>
</head>
<body>

<!-- ══ HEADER ══ -->
<header>
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
    <polyline points="14 2 14 8 20 8"/>
    <line x1="16" y1="13" x2="8" y2="13"/>
    <line x1="16" y1="17" x2="8" y2="17"/>
    <line x1="10" y1="9" x2="8" y2="9"/>
  </svg>
  <div>
    <h1>PDF 座標擷取工具</h1>
    <div class="subtitle">PDF Word / Character Coordinate Extractor + Verifier</div>
  </div>
</header>

<div class="layout">

  <!-- ══ SIDEBAR ══ -->
  <div class="sidebar">

    <!-- Upload -->
    <div>
      <div class="section-label">上傳 PDF 檔案</div>
      <div class="upload-zone" id="uploadZone">
        <input type="file" id="fileInput" accept=".pdf">
        <div class="upload-icon">📂</div>
        <p><strong>點擊選擇</strong> 或拖曳 PDF 至此</p>
        <p style="margin-top:4px">支援多頁 PDF 文件</p>
      </div>
      <div class="file-badge" id="fileBadge" style="margin-top:.5rem">
        <span>📄</span>
        <span class="fname" id="fileName"></span>
        <span class="fsize" id="fileSize"></span>
      </div>
    </div>

    <!-- Parse options -->
    <div>
      <div class="section-label">解析設定</div>
      <div class="opts">
        <div class="opt-row" style="flex-direction:column;align-items:flex-start;gap:.4rem">
          <label>擷取單位</label>
          <div class="radio-group">
            <label><input type="radio" name="granularity" value="word" checked> 單字 (Word)</label>
            <label><input type="radio" name="granularity" value="char"> 字元 (Char)</label>
          </div>
        </div>
        <div class="opt-row">
          <label>渲染縮放比 (Scale)</label>
          <input type="number" id="scaleInput" value="1.5" min="0.5" max="3" step="0.5">
        </div>
      </div>
    </div>

    <!-- Parse button -->
    <button class="btn btn-primary" id="parseBtn" disabled>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polygon points="5 3 19 12 5 21 5 3"/>
      </svg>
      開始解析
    </button>

    <!-- Progress -->
    <div class="progress-block" id="progressBlock">
      <div class="section-label">解析進度</div>
      <div class="progress-bg"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-txt" id="progressTxt">準備中…</div>
    </div>

    <!-- Stats -->
    <div class="stats-card" id="statsCard">
      <div class="section-label" style="margin-bottom:.4rem">解析結果</div>
      <div class="stat-row"><span>總頁數</span><span class="stat-val" id="sPages">—</span></div>
      <div class="stat-row"><span>擷取項目數</span><span class="stat-val" id="sItems">—</span></div>
      <div class="stat-row"><span>擷取單位</span><span class="stat-val" id="sUnit">—</span></div>
      <div class="stat-row"><span>渲染縮放</span><span class="stat-val" id="sScale">—</span></div>
    </div>

    <!-- Export -->
    <div>
      <div class="section-label">匯出資料</div>
      <div class="btn-row">
        <button class="btn btn-success" id="exportJson" disabled>⬇ JSON</button>
        <button class="btn btn-info"    id="exportCsv"  disabled>⬇ CSV</button>
      </div>
    </div>

    <hr class="divider">

    <!-- ══ VERIFY SECTION ══ -->
    <div class="verify-section" id="verifySection">
      <div class="section-label">🔍 座標驗證工具</div>

      <!-- Overlay toggle -->
      <button class="toggle-btn" id="overlayToggle">
        <div class="sw-track"></div>
        <span id="overlayLabel">顯示座標框（關閉）</span>
      </button>

      <!-- Opacity -->
      <div class="opt-row">
        <label style="flex-shrink:0">框線透明度</label>
        <input type="range" id="alphaSlider" min="10" max="100" value="70">
        <span id="alphaDisplay" style="font-size:.72rem;color:var(--text-muted);width:30px;text-align:right">70%</span>
      </div>

      <!-- Search -->
      <div>
        <label style="font-size:.8rem;color:var(--text-muted);display:block;margin-bottom:.3rem">
          搜尋文字高亮
          <span id="matchCount" style="color:var(--warn);margin-left:.4rem"></span>
        </label>
        <input type="text" id="searchInput" placeholder="輸入關鍵字…">
      </div>

      <!-- Color legend -->
      <div class="legend">
        <div class="chip"><div class="chip-dot" style="background:#4f7ef7"></div>一般</div>
        <div class="chip"><div class="chip-dot" style="background:#f5a623"></div>搜尋符合</div>
        <div class="chip"><div class="chip-dot" style="background:#3dba6e"></div>懸停</div>
      </div>

      <!-- External JSON load -->
      <div>
        <div style="font-size:.8rem;color:var(--text-muted);margin-bottom:.35rem">
          或載入外部 JSON 覆蓋
        </div>
        <label class="btn-sm">
          📂 選擇 JSON 檔案
          <input type="file" id="extJsonInput" accept=".json">
        </label>
        <span id="extJsonName" style="font-size:.72rem;color:var(--text-muted);margin-left:.5rem"></span>
      </div>

      <!-- Hover info -->
      <div>
        <div class="section-label">懸停項目詳情</div>
        <div class="hover-info" id="hoverInfo">（開啟座標框後，移動滑鼠至頁面上方以顯示詳情）</div>
      </div>
    </div>

    <!-- Log -->
    <div style="flex:1;display:flex;flex-direction:column;gap:.4rem;min-height:0">
      <div class="section-label">執行紀錄</div>
      <div class="log-box" id="logBox"></div>
    </div>

  </div><!-- /sidebar -->

  <!-- ══ PREVIEW ══ -->
  <div class="preview-area" id="previewArea">
    <div class="empty-state" id="emptyState">
      <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
        <line x1="10" y1="9" x2="8" y2="9"/>
      </svg>
      <p>上傳 PDF 並點擊「開始解析」以顯示預覽</p>
    </div>
  </div>

</div><!-- /layout -->

<!-- Tooltip (shared across all pages) -->
<div id="vTooltip"></div>

<!-- ══ SCRIPT ══ -->
<script>
'use strict';

pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ── State ─────────────────────────────────────────────────────────────────────
let currentFile    = null;
let extractedData  = [];
let overlayOn      = false;

// Map<pageNum, { overlayCanvas: HTMLCanvasElement, items: Array }>
const pageOverlayMap = new Map();

// ── DOM refs ──────────────────────────────────────────────────────────────────
const uploadZone    = document.getElementById('uploadZone');
const fileInput     = document.getElementById('fileInput');
const fileBadge     = document.getElementById('fileBadge');
const fileName      = document.getElementById('fileName');
const fileSize      = document.getElementById('fileSize');
const parseBtn      = document.getElementById('parseBtn');
const exportJson    = document.getElementById('exportJson');
const exportCsv     = document.getElementById('exportCsv');
const previewArea   = document.getElementById('previewArea');
const emptyState    = document.getElementById('emptyState');
const progressBlock = document.getElementById('progressBlock');
const progressFill  = document.getElementById('progressFill');
const progressTxt   = document.getElementById('progressTxt');
const statsCard     = document.getElementById('statsCard');
const logBox        = document.getElementById('logBox');
const scaleInput    = document.getElementById('scaleInput');
// verify
const verifySection = document.getElementById('verifySection');
const overlayToggle = document.getElementById('overlayToggle');
const overlayLabel  = document.getElementById('overlayLabel');
const alphaSlider   = document.getElementById('alphaSlider');
const alphaDisplay  = document.getElementById('alphaDisplay');
const searchInput   = document.getElementById('searchInput');
const matchCount    = document.getElementById('matchCount');
const hoverInfo     = document.getElementById('hoverInfo');
const extJsonInput  = document.getElementById('extJsonInput');
const extJsonName   = document.getElementById('extJsonName');
const vTooltip      = document.getElementById('vTooltip');

// ── Logging ───────────────────────────────────────────────────────────────────
function log(msg, cls = '') {
  const el = document.createElement('div');
  el.className = 'log-line' + (cls ? ' ' + cls : '');
  const ts = new Date().toLocaleTimeString('zh-TW', { hour12: false });
  el.textContent = `[${ts}] ${msg}`;
  logBox.appendChild(el);
  logBox.scrollTop = logBox.scrollHeight;
}

function setProgress(pct, msg) {
  progressFill.style.width = `${Math.min(100, pct)}%`;
  progressTxt.textContent  = msg;
}

// ── File upload ───────────────────────────────────────────────────────────────
uploadZone.addEventListener('click', () => fileInput.click());
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault(); uploadZone.classList.remove('drag-over');
  const f = e.dataTransfer.files[0];
  if (f && f.type === 'application/pdf') loadFile(f);
  else log('請選擇有效的 .pdf 檔案', 'err');
});
fileInput.addEventListener('change', e => { if (e.target.files[0]) loadFile(e.target.files[0]); });

function loadFile(file) {
  currentFile = file;
  fileName.textContent = file.name;
  fileSize.textContent = formatBytes(file.size);
  fileBadge.classList.add('visible');
  parseBtn.disabled = false;
  extractedData = [];
  exportJson.disabled = exportCsv.disabled = true;
  statsCard.classList.remove('visible');
  verifySection.classList.remove('visible');
  pageOverlayMap.clear();
  log(`已載入: ${file.name}  (${formatBytes(file.size)})`, 'hi');
}

function formatBytes(b) {
  if (b < 1024)    return `${b} B`;
  if (b < 1048576) return `${(b/1024).toFixed(1)} KB`;
  return `${(b/1048576).toFixed(2)} MB`;
}

// ── Parse ─────────────────────────────────────────────────────────────────────
parseBtn.addEventListener('click', async () => {
  if (!currentFile) return;

  const scale       = Math.max(0.5, Math.min(3, parseFloat(scaleInput.value) || 1.5));
  const granularity = document.querySelector('input[name="granularity"]:checked').value;

  parseBtn.disabled = exportJson.disabled = exportCsv.disabled = true;
  extractedData = [];
  pageOverlayMap.clear();
  overlayOn = false;
  overlayToggle.classList.remove('active');
  overlayLabel.textContent = '顯示座標框（關閉）';

  progressBlock.classList.add('visible');
  statsCard.classList.remove('visible');
  verifySection.classList.remove('visible');
  setProgress(0, '讀取 PDF 檔案…');

  [...previewArea.children].forEach(c => { if (c.id !== 'emptyState') c.remove(); });
  emptyState.style.display = 'none';

  log(`── 開始解析 (scale=${scale}, unit=${granularity}) ──`, 'hi');

  try {
    const buffer   = await readArrayBuffer(currentFile);
    const pdf      = await pdfjsLib.getDocument({ data: buffer }).promise;
    const numPages = pdf.numPages;
    log(`PDF 載入成功，共 ${numPages} 頁`, 'ok');
    setProgress(5, `共 ${numPages} 頁，開始逐頁渲染…`);

    let globalIdx = 0;
    for (let p = 1; p <= numPages; p++) {
      setProgress(5 + Math.round(((p - 1) / numPages) * 90), `渲染第 ${p} / ${numPages} 頁…`);
      const { items, nextIdx } = await processPage(pdf, p, scale, granularity, globalIdx);
      extractedData.push(...items);
      globalIdx = nextIdx;
      log(`第 ${p} 頁：${items.length} 個${granularity === 'word' ? '單字' : '字元'}`);
    }

    setProgress(100, '解析完成！');

    document.getElementById('sPages').textContent = numPages;
    document.getElementById('sItems').textContent = extractedData.length.toLocaleString();
    document.getElementById('sUnit').textContent  = granularity === 'word' ? 'Word' : 'Char';
    document.getElementById('sScale').textContent = `${scale}x`;
    statsCard.classList.add('visible');
    exportJson.disabled = exportCsv.disabled = false;
    verifySection.classList.add('visible');

    log(`完成！共擷取 ${extractedData.length} 個項目`, 'ok');
  } catch (err) {
    log(`錯誤：${err.message}`, 'err');
    console.error(err);
    setProgress(0, '解析失敗');
  } finally {
    parseBtn.disabled = false;
  }
});

// ── Process single page ───────────────────────────────────────────────────────
async function processPage(pdf, pageNum, scale, granularity, globalIdx) {
  const page     = await pdf.getPage(pageNum);
  const viewport = page.getViewport({ scale });

  // Containers
  const block = document.createElement('div');
  block.className = 'page-block';

  const wrap = document.createElement('div');
  wrap.className = 'page-wrap';
  wrap.style.width  = `${viewport.width}px`;
  wrap.style.height = `${viewport.height}px`;

  // PDF canvas
  const canvas  = document.createElement('canvas');
  canvas.width  = viewport.width;
  canvas.height = viewport.height;
  canvas.style.display = 'block';
  wrap.appendChild(canvas);

  // Text layer
  const textLayerDiv = document.createElement('div');
  textLayerDiv.className = 'textLayer';
  textLayerDiv.style.width  = `${viewport.width}px`;
  textLayerDiv.style.height = `${viewport.height}px`;
  wrap.appendChild(textLayerDiv);

  // Overlay canvas (for coordinate boxes)
  const overlayCanvas   = document.createElement('canvas');
  overlayCanvas.className    = 'overlay-canvas';
  overlayCanvas.width        = viewport.width;
  overlayCanvas.height       = viewport.height;
  overlayCanvas.style.display = 'none';   // always start hidden
  wrap.appendChild(overlayCanvas);

  // Hit-test div (transparent, sits on top, captures mouse events)
  const hitDiv = document.createElement('div');
  hitDiv.className = 'hit-div';
  wrap.appendChild(hitDiv);

  // Label
  const lbl = document.createElement('div');
  lbl.className   = 'page-lbl';
  lbl.textContent = `第 ${pageNum} 頁  (${Math.round(viewport.width)} × ${Math.round(viewport.height)} px)`;

  block.appendChild(wrap);
  block.appendChild(lbl);
  previewArea.appendChild(block);

  // Render PDF canvas
  await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;

  // Render text layer
  const textContent = await page.getTextContent();
  await pdfjsLib.renderTextLayer({
    textContentSource: textContent,
    container: textLayerDiv,
    viewport,
    textDivs: [],
  }).promise;

  await waitFrames(2);

  // Extract coordinates directly from PDF text content data.
  // viewport.convertToViewportPoint() uses the same math PDF.js uses to position
  // the text layer spans, so coordinates are exact by definition.
  const items   = extractCoords(textContent, viewport, pageNum, globalIdx, granularity);
  const nextIdx = globalIdx + items.length;

  // Register in overlay map
  pageOverlayMap.set(pageNum, { overlayCanvas, items });

  // Mouse events via hit div
  hitDiv.addEventListener('mousemove',  e => onPageMouseMove(e, wrap, pageNum));
  hitDiv.addEventListener('mouseleave', ()  => onPageMouseLeave(pageNum));

  return { items, nextIdx };
}

// ── Coordinate extraction ─────────────────────────────────────────────────────
// Uses PDF.js text content data + viewport.convertToViewportPoint() for exact
// coordinate conversion — the same math PDF.js uses to position text layer spans.
// canvas.measureText() is used only for proportional word splitting within each
// text item (the only remaining approximation).
function extractCoords(textContent, viewport, pageNum, startIdx, granularity) {
  const results = [];
  let   idx     = startIdx;

  // Off-screen canvas for proportional within-item character width estimation.
  const mc = document.createElement('canvas').getContext('2d');
  mc.font  = '1000px Arial, sans-serif';   // very large → sub-pixel accurate ratios

  for (const item of textContent.items) {
    const str = item.str;
    if (!str || !str.trim()) continue;

    // item.transform = [a, b, c, d, e, f]  (PDF combined text+CTM matrix)
    // (e, f) is the glyph origin (baseline-left) in PDF user-space coordinates.
    const [a, b, c, d, e, f] = item.transform;

    // Convert baseline-left from PDF user space → viewport CSS pixels.
    // This is the identical transformation PDF.js applies to position each span.
    const [vpX, vpY] = viewport.convertToViewportPoint(e, f);

    // Advance width of this text item in CSS pixels (exact, from PDF data).
    const vpWidth = item.width * viewport.scale;
    if (vpWidth < 0.5) continue;

    // Visual font height in viewport pixels.
    // Math.hypot(c, d) = the Y-axis scale magnitude of the PDF matrix.
    // Multiplied by viewport.scale converts PDF user units → CSS pixels.
    const fontH = Math.hypot(c, d) * viewport.scale;
    if (fontH < 0.5) continue;

    // In viewport space Y increases downward; vpY is the BASELINE.
    // Characters sit ABOVE the baseline, so top = vpY - fontH.
    const vTop  = vpY - fontH;
    const vLeft = vpX;

    // Proportional word/char splitting via canvas measureText.
    const totalMW = mc.measureText(str).width || 1;

    function push(chunk, chunkStart) {
      const preW  = mc.measureText(str.slice(0, chunkStart)).width;
      const chW   = mc.measureText(chunk).width;
      const wLeft  = vLeft + (preW / totalMW) * vpWidth;
      const wWidth = (chW  / totalMW) * vpWidth;
      if (wWidth < 0.5) return;
      results.push({
        page: pageNum, index: idx++, text: chunk,
        top:    round4(vTop),
        left:   round4(wLeft),
        right:  round4(wLeft + wWidth),
        bottom: round4(vpY),
        width:  round4(wWidth),
        height: round4(fontH),
      });
    }

    if (granularity === 'word') {
      const re = /\S+/g;
      let m;
      while ((m = re.exec(str)) !== null) push(m[0], m.index);
    } else {
      for (let i = 0; i < str.length; i++) {
        if (!/\s/.test(str[i])) push(str[i], i);
      }
    }
  }

  return results;
}

function round4(n) { return Math.round(n * 10000) / 10000; }

// ── Overlay drawing ───────────────────────────────────────────────────────────
function drawOverlay(overlayCanvas, items, search, alpha, hoverItem = null) {
  const ctx = overlayCanvas.getContext('2d');
  ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

  items.forEach(item => {
    const isHover = hoverItem && item.index === hoverItem.index;
    const isMatch = search && item.text.includes(search);

    if (isHover) {
      ctx.strokeStyle = `rgba(61,186,110,${alpha})`;
      ctx.fillStyle   = 'rgba(61,186,110,0.18)';
      ctx.lineWidth   = 2;
    } else if (isMatch) {
      ctx.strokeStyle = `rgba(245,166,35,${alpha})`;
      ctx.fillStyle   = 'rgba(245,166,35,0.15)';
      ctx.lineWidth   = 1.5;
    } else {
      ctx.strokeStyle = `rgba(79,126,247,${Math.min(alpha, 0.65)})`;
      ctx.fillStyle   = null;
      ctx.lineWidth   = 1;
    }

    const lw = ctx.lineWidth;
    ctx.strokeRect(item.left + lw/2, item.top + lw/2, item.width - lw, item.height - lw);
    if ((isHover || isMatch) && ctx.fillStyle) {
      ctx.fillRect(item.left, item.top, item.width, item.height);
    }
  });
}

function redrawAllOverlays(hoverPageNum = null, hoverItem = null) {
  const alpha  = parseFloat(alphaSlider.value) / 100;
  const search = searchInput.value.trim();
  pageOverlayMap.forEach(({ overlayCanvas, items }, pageNum) => {
    const hi = (pageNum === hoverPageNum) ? hoverItem : null;
    drawOverlay(overlayCanvas, items, search, alpha, hi);
  });
  updateMatchCount(search);
}

function updateMatchCount(search) {
  if (!search) { matchCount.textContent = ''; return; }
  let n = 0;
  pageOverlayMap.forEach(({ items }) => { n += items.filter(i => i.text.includes(search)).length; });
  matchCount.textContent = `${n} 筆符合`;
}

// ── Overlay toggle ────────────────────────────────────────────────────────────
overlayToggle.addEventListener('click', () => {
  overlayOn = !overlayOn;
  overlayToggle.classList.toggle('active', overlayOn);
  overlayLabel.textContent = overlayOn ? '顯示座標框（開啟）' : '顯示座標框（關閉）';

  pageOverlayMap.forEach(({ overlayCanvas }) => {
    if (overlayOn) {
      overlayCanvas.style.display = 'block';
    } else {
      // Clear canvas content first, then hide — prevents ghost drawing when re-shown
      overlayCanvas.getContext('2d').clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
      overlayCanvas.style.display = 'none';
    }
  });

  document.querySelectorAll('.hit-div').forEach(d => d.classList.toggle('active', overlayOn));

  if (overlayOn) redrawAllOverlays();
  log(`座標框：${overlayOn ? '開啟' : '關閉'}`);
});

// ── Slider / search live update ───────────────────────────────────────────────
alphaSlider.addEventListener('input', () => {
  alphaDisplay.textContent = alphaSlider.value + '%';
  if (overlayOn) redrawAllOverlays();
});

searchInput.addEventListener('input', () => {
  if (overlayOn) redrawAllOverlays();
  else updateMatchCount(searchInput.value.trim());
});

// ── Mouse interaction ─────────────────────────────────────────────────────────
function onPageMouseMove(e, wrap, pageNum) {
  if (!overlayOn) return;

  const { overlayCanvas, items } = pageOverlayMap.get(pageNum);
  const wRect = wrap.getBoundingClientRect();
  const mx = e.clientX - wRect.left;
  const my = e.clientY - wRect.top;

  // Find item under cursor; prefer smallest area when overlapping
  let best = null, bestArea = Infinity;
  items.forEach(item => {
    if (mx >= item.left && mx <= item.right && my >= item.top && my <= item.bottom) {
      const area = item.width * item.height;
      if (area < bestArea) { best = item; bestArea = area; }
    }
  });

  const alpha  = parseFloat(alphaSlider.value) / 100;
  const search = searchInput.value.trim();
  drawOverlay(overlayCanvas, items, search, alpha, best);

  if (best) {
    hoverInfo.textContent =
      `Page   : ${best.page}\n` +
      `Index  : ${best.index}\n` +
      `Text   : "${best.text}"\n` +
      `Top    : ${best.top}\n` +
      `Left   : ${best.left}\n` +
      `Right  : ${best.right}\n` +
      `Bottom : ${best.bottom}\n` +
      `Width  : ${best.width}\n` +
      `Height : ${best.height}`;

    vTooltip.innerHTML =
      `<b style="color:#4f7ef7">"${escHtml(best.text)}"</b><br>` +
      `Page ${best.page} · #${best.index}<br>` +
      `(${best.left.toFixed(1)}, ${best.top.toFixed(1)})  ` +
      `${best.width.toFixed(1)} × ${best.height.toFixed(1)} px`;
    vTooltip.style.display = 'block';
    vTooltip.style.left    = `${e.clientX + 14}px`;
    vTooltip.style.top     = `${e.clientY - 10}px`;
  } else {
    vTooltip.style.display = 'none';
    hoverInfo.textContent  = '（移動滑鼠至頁面上方以顯示詳情）';
  }
}

function onPageMouseLeave(pageNum) {
  if (!overlayOn) return;
  const { overlayCanvas, items } = pageOverlayMap.get(pageNum);
  const alpha  = parseFloat(alphaSlider.value) / 100;
  const search = searchInput.value.trim();
  drawOverlay(overlayCanvas, items, search, alpha);
  vTooltip.style.display = 'none';
  hoverInfo.textContent  = '（移動滑鼠至頁面上方以顯示詳情）';
}

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── External JSON load ────────────────────────────────────────────────────────
extJsonInput.addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data)) throw new Error('JSON 需為陣列格式');

    // Group by page and update overlay map
    const byPage = new Map();
    data.forEach(item => {
      if (!byPage.has(item.page)) byPage.set(item.page, []);
      byPage.get(item.page).push(item);
    });

    let updated = 0;
    byPage.forEach((items, p) => {
      if (pageOverlayMap.has(p)) {
        pageOverlayMap.get(p).items = items;
        updated++;
      }
    });

    extJsonName.textContent = f.name;
    if (overlayOn) redrawAllOverlays();
    log(`外部 JSON 載入：${data.length} 筆，更新 ${updated} 頁`, 'ok');
  } catch (err) {
    log(`JSON 載入失敗：${err.message}`, 'err');
  }
});

// ── Utilities ─────────────────────────────────────────────────────────────────
function waitFrames(n) {
  return new Promise(resolve => {
    let c = 0;
    const tick = () => { if (++c >= n) resolve(); else requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  });
}

function readArrayBuffer(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload  = e => res(e.target.result);
    fr.onerror = ()  => rej(new Error('FileReader 讀取失敗'));
    fr.readAsArrayBuffer(file);
  });
}

function triggerDownload(content, filename, mime) {
  const blob = new Blob([content], { type: mime });
  const url  = URL.createObjectURL(blob);
  Object.assign(document.createElement('a'), { href: url, download: filename }).click();
  URL.revokeObjectURL(url);
}

// ── Export ────────────────────────────────────────────────────────────────────
exportJson.addEventListener('click', () => {
  if (!extractedData.length) return;
  triggerDownload(JSON.stringify(extractedData, null, 2), 'pdf_coordinates.json', 'application/json');
  log(`匯出 JSON：${extractedData.length} 筆`, 'ok');
});

exportCsv.addEventListener('click', () => {
  if (!extractedData.length) return;
  const header = 'Page,Index,Text,Top,Left,Right,Bottom,Width,Height';
  const rows   = extractedData.map(d => [
    d.page, d.index,
    `"${String(d.text).replace(/"/g,'""')}"`,
    d.top, d.left, d.right, d.bottom, d.width, d.height,
  ].join(','));
  triggerDownload('﻿' + [header, ...rows].join('\r\n'), 'pdf_coordinates.csv', 'text/csv;charset=utf-8');
  log(`匯出 CSV：${extractedData.length} 筆`, 'ok');
});
</script>
