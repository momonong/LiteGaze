readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "flask>=3.1.3",
    "google-genai>=1.73.1",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "opencv-python>=4.13.0.92",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "pdfplumber>=0.11.9",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "spacy>=3.8.14",
    "torch>=2.12.0",
    "transformers>=5.7.0",
]
