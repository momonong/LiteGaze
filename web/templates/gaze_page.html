<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#ffffff" />
    <title>UniGaze 眼動追蹤</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <style>
:root {
  color-scheme: light;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  --bg-base: #ffffff;
  --bg-elevated: #fafafa;
  --bg-highest: #f4f4f5;
  --ink-primary: #09090b;
  --ink-secondary: #52525b;
  --ink-muted: #a1a1aa;
  --line: rgba(0, 0, 0, 0.06);
  --line-strong: #e4e4e7;
  --accent: #2563eb;
  --accent-hover: #1d4ed8;
  --accent-soft: #eff6ff;
  --accent-2: #3b82f6;
  --accent-2-hover: #2563eb;
  --accent-2-soft: #f0f5ff;
  --success: #10b981;
  --success-soft: #ecfdf5;
  --danger: #ef4444;
  --danger-soft: #fef2f2;
  --warning: #f59e0b;
  --warning-soft: #fffbeb;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
  --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.1);
  --z-stage: 1;
  --z-cursor: 99;
  --z-dock: 100;
  --z-test-controls: 101;
  --z-hud: 10000;
  --z-heatmap: 9998;
  --z-modal: 20000;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-width: 320px; min-height: 100dvh; overflow: hidden;
  background: var(--bg-base);
  padding-top: var(--safe-top); padding-bottom: var(--safe-bottom);
  padding-left: var(--safe-left); padding-right: var(--safe-right);
  color: var(--ink-primary);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
button, input, select { font: inherit; }
button {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 40px; border: 1px solid transparent; border-radius: var(--radius-md);
  padding: 0 16px; color: #fff; background: var(--accent); cursor: pointer;
  transition: all 150ms ease; user-select: none; -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
button:hover:not(:disabled) { background: var(--accent-hover); }
button:active:not(:disabled) { opacity: 0.85; }
button:disabled { cursor: not-allowed; opacity: 0.4; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, select {
  width: 100%; min-height: 42px; border: 1px solid var(--line);
  border-radius: var(--radius-sm); padding: 8px 12px; color: var(--ink-primary);
  background: var(--bg-base); outline: none;
  transition: border-color 180ms ease, box-shadow 180ms ease;
}
input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
input::placeholder { color: var(--ink-muted); }
#stage { position: relative; width: 100vw; height: 100dvh; }
#target {
  position: absolute; z-index: var(--z-stage); width: 36px; height: 36px;
  border: 3px solid #000000; border-radius: 50%;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 0 12px rgba(9, 9, 11, 0.05);
  transition: left 200ms cubic-bezier(0.16, 1, 0.3, 1), top 200ms cubic-bezier(0.16, 1, 0.3, 1), transform 150ms ease;
}
#target::after {
  position: absolute; inset: 10px; border-radius: 50%; background: #000000; content: "";
}
#target.capturing { transform: translate(-50%, -50%) scale(0.78); border-color: var(--accent); }
#target.capturing::after { background: var(--accent); }
#target.hidden { display: none; }
#backLink {
  position: fixed;
  top: calc(12px + var(--safe-top));
  left: calc(12px + var(--safe-left));
  z-index: 10001;
  display: flex;
  align-items: center;
  gap: 4px;
  color: var(--ink-secondary);
  font-size: 0.85rem;
  font-weight: 500;
  text-decoration: none;
  cursor: pointer;
  padding: 6px 10px;
  border-radius: var(--radius-md);
  transition: all 0.15s ease;
}
#backLink:hover {
  color: var(--accent);
  background: var(--accent-soft);
}
#gaze-cursor {
  position: absolute; z-index: var(--z-cursor); width: 18px; height: 18px;
  background: rgba(9, 9, 11, 0.15); border: 1.5px solid #000000; border-radius: 50%;
  transform: translate(-50%, -50%); box-shadow: 0 0 0 4px rgba(9, 9, 11, 0.05);
  pointer-events: none;
  transition: left 80ms cubic-bezier(0.1, 0.8, 0.25, 1), top 80ms cubic-bezier(0.1, 0.8, 0.25, 1);
}
#gaze-cursor.hidden { display: none; }
.gaze-hud {
  position: fixed; z-index: var(--z-hud);
  top: calc(16px + var(--safe-top)); left: 16px;
  background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px); border: 1px solid #e4e4e7;
  border-radius: var(--radius-md); padding: 8px 14px;
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 13px; color: #09090b; box-shadow: var(--shadow-md);
  pointer-events: none; display: flex; align-items: center; gap: 8px;
  transition: opacity 250ms ease, transform 250ms ease;
}
.gaze-hud.hidden { opacity: 0; transform: translateY(-8px); pointer-events: none; }
.hud-label { opacity: 0.55; font-weight: 700; font-size: 11px; letter-spacing: 0.5px; color: var(--ink-secondary); }
.hud-value { font-weight: 600; }
#heatmap-overlay {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh;
  z-index: var(--z-heatmap); pointer-events: none; opacity: 1;
  transition: opacity 300ms ease;
}
#heatmap-overlay.hidden { opacity: 0; }
.bottom-dock {
  position: fixed; z-index: var(--z-dock);
  bottom: calc(16px + var(--safe-bottom)); left: 50%;
  transform: translateX(-50%);
  display: flex; align-items: center; justify-content: space-between;
  width: min(900px, calc(100vw - 24px)); height: 72px;
  border: 1px solid var(--line); border-radius: var(--radius-lg);
  padding: 0 16px;
  background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px); box-shadow: var(--shadow-lg);
  transition: opacity 300ms ease, transform 300ms ease; gap: 8px;
}
.bottom-dock.fade-out { opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(12px); }
.dock-left { display: flex; align-items: center; gap: 12px; min-width: 0; flex-shrink: 0; }
.video-wrap { position: relative; width: 48px; height: 48px; flex-shrink: 0; }
.video-circle {
  position: relative; width: 100%; height: 100%; border: 2px solid var(--line);
  border-radius: 50%; overflow: hidden; background: var(--bg-highest);
}
.video-circle video { display: block; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
.cam-switch {
  position: absolute; bottom: -4px; right: -4px; width: 22px; height: 22px;
  min-height: auto; border-radius: 50%; background: var(--bg-base);
  border: 1.5px solid var(--line); color: var(--ink-secondary); padding: 0;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  box-shadow: var(--shadow-sm); z-index: 2;
}
.cam-switch:hover { background: var(--bg-elevated); color: var(--ink-primary); transform: none; }
.cam-switch:active { transform: scale(0.9); }
.dock-status { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.status-top { display: flex; align-items: center; gap: 8px; }
.health-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-muted); transition: all 300ms ease; flex-shrink: 0; }
.health-dot.ok { background: var(--success); box-shadow: 0 0 6px var(--success); }
.health-dot.bad { background: var(--danger); box-shadow: 0 0 6px var(--danger); }
.session-lbl { font-size: 12px; color: var(--ink-muted); max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.session-lbl strong { color: var(--ink-primary); font-weight: 600; }
.status-bottom { font-size: 11px; color: var(--ink-muted); display: flex; align-items: center; gap: 4px; }
.divider { color: var(--line-strong); }
.dock-center { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.dock-center button { font-size: 14px; font-weight: 600; min-height: 40px; padding: 0 16px; border-radius: var(--radius-md); white-space: nowrap; }
.dock-center button#calibration { background: var(--accent); color: #fff; }
.dock-center button#calibration:hover:not(:disabled) { background: var(--accent-hover); }
.dock-center button#train { background: var(--accent-2); color: #fff; }
.dock-center button#train:hover:not(:disabled) { background: var(--accent-2-hover); }
.dock-center button#test { background: var(--bg-elevated); color: var(--ink-primary); border: 1.5px solid var(--line); }
.dock-center button#test:hover:not(:disabled) { background: var(--bg-highest); border-color: var(--line-strong); }
.dock-center button.btn-inactive { background: var(--bg-highest) !important; border: 1.5px solid var(--line) !important; color: var(--ink-muted) !important; cursor: not-allowed; opacity: 0.5; box-shadow: none !important; transform: none !important; animation: none !important; }
.dock-center button:disabled { cursor: not-allowed; opacity: 0.35; background: var(--bg-highest) !important; border-color: var(--line) !important; color: var(--ink-muted) !important; box-shadow: none !important; transform: none !important; animation: none !important; }
.dock-center button.glow-ready { animation: btn-ready 1.6s infinite alternate; border-color: var(--accent-2); }
@keyframes btn-ready { 0% { box-shadow: 0 0 4px rgba(139, 92, 246, 0.2), 0 0 8px rgba(139, 92, 246, 0.08); } 100% { box-shadow: 0 0 14px rgba(139, 92, 246, 0.5), 0 0 24px rgba(139, 92, 246, 0.2); transform: scale(1.03); } }
.btn-icon-only { width: 50px; height: 50px; padding: 0; border-radius: var(--radius-md); background: transparent; border: 1.5px solid var(--line); color: var(--ink-secondary); flex-shrink: 0; }
.btn-icon-only svg { width: 24px; height: 24px; }
.btn-icon-only:hover:not(:disabled) { background: var(--bg-elevated); color: var(--ink-primary); border-color: var(--line-strong); }
.btn-icon-only:active:not(:disabled) { transform: scale(0.92); }
.dock-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.dock-icon-btn { display: flex; align-items: center; justify-content: center; width: 50px; height: 50px; border: 1.5px solid var(--line); border-radius: var(--radius-md); background: transparent; color: var(--ink-muted); cursor: pointer; transition: all 150ms ease; flex-shrink: 0; }
.dock-icon-btn svg { width: 24px; height: 24px; }
.dock-icon-btn:hover { color: var(--ink-primary); background: var(--bg-elevated); border-color: var(--line-strong); }
.dock-icon-btn.active { color: var(--accent); background: var(--accent-soft); border-color: var(--accent); }
.dock-tray { position: absolute; bottom: calc(100% + 10px); right: 0; width: 340px; max-width: calc(100vw - 24px); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 20px; background: rgba(255, 255, 255, 0.97); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); box-shadow: var(--shadow-lg); transition: all 250ms cubic-bezier(0.16, 1, 0.3, 1); transform: translateY(0); opacity: 1; visibility: visible; }
.dock-tray.hidden { transform: translateY(8px); opacity: 0; visibility: hidden; pointer-events: none; }
.dock-tray h3 { margin: 0 0 14px; font-size: 13px; font-weight: 700; color: var(--ink-primary); letter-spacing: 0.3px; text-transform: uppercase; }
#logsTray { right: 0; }
#log { min-height: 160px; max-height: 260px; margin: 0; overflow: auto; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 12px; color: var(--ink-secondary); background: var(--bg-elevated); font-size: 11px; font-family: "JetBrains Mono", ui-monospace, monospace; line-height: 1.6; white-space: pre-wrap; }
.test-controls { position: fixed; bottom: calc(100px + var(--safe-bottom)); left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 8px 16px; height: 48px; box-shadow: var(--shadow-md); transition: all 250ms cubic-bezier(0.16, 1, 0.3, 1); opacity: 1; z-index: var(--z-test-controls); }
.test-controls.hidden { opacity: 0; transform: translateX(-50%) translateY(12px); pointer-events: none; visibility: hidden; }
.dock-select { background: var(--bg-elevated); border: 1.5px solid var(--line); border-radius: var(--radius-sm); color: var(--ink-primary); font-size: 12px; padding: 4px 8px; height: 32px; cursor: pointer; outline: none; min-height: auto; transition: border-color 150ms ease; }
.dock-select:hover { border-color: var(--line-strong); }
.dock-select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.checkbox-container { display: flex; align-items: center; gap: 5px; cursor: pointer; font-size: 12px; color: var(--ink-secondary); user-select: none; white-space: nowrap; }
.checkbox-container input { cursor: pointer; accent-color: var(--accent); width: auto; min-height: auto; }
.chk-icon { flex-shrink: 0; opacity: 0.5; }
.checkbox-container input:checked ~ .chk-icon { opacity: 1; color: var(--accent); }
.chk-lbl { white-space: nowrap; font-size: 12px; }
.modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: rgba(0, 0, 0, 0.35); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: var(--z-modal); display: flex; align-items: center; justify-content: center; opacity: 1; transition: opacity 240ms cubic-bezier(0.16, 1, 0.3, 1); padding: 16px; }
.modal-overlay.hidden { opacity: 0; pointer-events: none; }
.modal-card { width: 100%; max-width: 420px; background: var(--bg-base); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); padding: 24px; transform: scale(1); transition: transform 240ms cubic-bezier(0.34, 1.56, 0.64, 1); }
.modal-overlay.hidden .modal-card { transform: scale(0.92); }
.modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.modal-header h3 { margin: 0; font-size: 18px; font-weight: 700; color: var(--ink-primary); }
.modal-close { background: transparent; border: none; color: var(--ink-muted); cursor: pointer; padding: 4px; min-height: auto; border-radius: var(--radius-sm); transition: color 150ms ease, background 150ms ease; display: flex; }
.modal-close:hover { color: var(--ink-primary); background: var(--bg-elevated); transform: none; }
.modal-body { margin-bottom: 24px; display: flex; flex-direction: column; gap: 16px; }
.modal-sub { margin: -8px 0 4px; font-size: 12px; color: var(--ink-muted); }
.modal-sub code { background: var(--bg-elevated); padding: 1px 5px; border-radius: 3px; font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12px; color: var(--ink-secondary); font-weight: 500; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal-footer { display: flex; justify-content: flex-end; gap: 10px; }
.btn-primary { background: var(--accent); color: #fff; font-weight: 600; }
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
.btn-secondary { background: transparent; color: var(--ink-primary); border: 1.5px solid var(--line); }
.btn-secondary:hover:not(:disabled) { background: var(--bg-elevated); border-color: var(--line-strong); }
.models-list { max-height: 220px; overflow-y: auto; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--bg-elevated); }
.empty-list { padding: 24px; text-align: center; color: var(--ink-muted); font-size: 12px; }
.field-with-actions { display: flex; gap: 6px; align-items: center; }
.field-with-actions select { flex: 1; }
.btn-icon-sm {
  display: inline-flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; min-height: 36px; padding: 0;
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  background: transparent; color: var(--ink-muted); cursor: pointer;
  flex-shrink: 0; transition: all 150ms ease;
}
.btn-icon-sm:hover { color: var(--ink-primary); background: var(--bg-elevated); border-color: var(--line-strong); }
.btn-icon-sm.danger:hover { color: var(--danger); border-color: var(--danger); background: var(--danger-soft); }
.model-item { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.model-item:last-child { border-bottom: none; }
.model-info { flex: 1; min-width: 0; }
.model-info-name { font-size: 13px; font-weight: 600; color: var(--ink-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.model-info-meta { font-size: 11px; color: var(--ink-muted); margin-top: 2px; }
.model-actions { display: flex; gap: 4px; flex-shrink: 0; }
@media (max-width: 820px) {
  .bottom-dock { height: auto; padding: 12px 14px; flex-wrap: wrap; justify-content: center; gap: 10px; bottom: calc(12px + var(--safe-bottom)); }
  .dock-left { width: 100%; justify-content: center; }
  .dock-status { align-items: center; text-align: center; }
  .session-lbl { max-width: 200px; }
  .dock-center { width: 100%; justify-content: center; flex-wrap: wrap; }
  .dock-center button { font-size: 13px; padding: 0 12px; min-height: 38px; }
  .dock-center button.btn-icon-only { width: 42px; height: 42px; min-height: 42px; padding: 0; }
  .dock-right { display: none; }
  .dock-tray { position: fixed; bottom: calc(80px + var(--safe-bottom)); left: 12px; right: 12px; width: auto; max-width: none; }
  .test-controls { flex-wrap: wrap; height: auto; padding: 8px 12px; gap: 8px; justify-content: center; bottom: calc(80px + var(--safe-bottom)); }
  .gaze-hud { top: calc(8px + var(--safe-top)); left: 8px; font-size: 11px; padding: 6px 10px; }
  .modal-card { padding: 20px 16px; }
  #log { min-height: 120px; max-height: 200px; }
}
@media (max-width: 480px) {
  .bottom-dock { padding: 10px; gap: 8px; }
  .dock-center button { font-size: 12px; padding: 0 10px; min-height: 36px; }
  .dock-center button.btn-icon-only { width: 36px; height: 36px; min-height: 36px; padding: 0; }
  .dock-center button.btn-icon-only svg { display: block; width: 18px; height: 18px; }
  .dock-center button svg { display: none; }
  .video-wrap { width: 40px; height: 40px; }
  .cam-switch { width: 20px; height: 20px; bottom: -3px; right: -3px; }
  .dock-select { font-size: 11px; height: 28px; padding: 2px 6px; }
  .checkbox-container { font-size: 11px; }
  .test-controls { gap: 6px; padding: 6px 10px; }
  .field-row { grid-template-columns: 1fr; }
}
@media (min-width: 1024px) { .bottom-dock { padding: 0 20px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; } }
    </style>
  </head>
  <body>
    <div id="gaze-coordinates" class="gaze-hud hidden">
      <span class="hud-label">眼動</span>
      <span class="hud-value" id="hudCoords">X: -- px | Y: -- px</span>
    </div>

    <canvas id="heatmap-overlay" class="hidden"></canvas>

    <main id="stage" aria-label="校正舞台">
      <div id="target" aria-hidden="true"></div>
      <div id="gaze-cursor" class="hidden" aria-hidden="true"></div>

      <div id="testControls" class="test-controls hidden">
        <select id="testModeSelect" class="dock-select">
          <option value="before">原始模型</option>
        </select>
        <label class="checkbox-container">
          <input type="checkbox" id="toggleHeatmap" />
          <svg class="chk-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <span class="chk-lbl">熱區</span>
        </label>
        <label class="checkbox-container">
          <input type="checkbox" id="toggleAntiShake" checked />
          <svg class="chk-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 12 5 12 8 3 13 21 16 12 20 12 23 12"/><line x1="1" y1="12" x2="23" y2="12"/></svg>
          <span class="chk-lbl">防抖</span>
        </label>
        <label class="checkbox-container">
          <input type="checkbox" id="toggleCorridorLock" />
          <svg class="chk-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <span class="chk-lbl">鎖行</span>
        </label>
      </div>

      <section class="bottom-dock" id="bottomDock" aria-label="控制面板">
        <div class="dock-left">
          <div class="video-wrap">
            <div class="video-circle" id="videoCircle">
              <video id="video" autoplay playsinline muted></video>
              <canvas id="capture" width="640" height="480" hidden></canvas>
            </div>
            <button id="btnSwitchCamera" class="cam-switch" title="切換鏡頭" aria-label="切換前後鏡頭">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
            </button>
          </div>
          <div class="dock-status">
            <div class="status-top">
              <span id="health" class="health-dot"></span>
              <span class="session-lbl">Session: <strong id="session">—</strong></span>
            </div>
            <div class="status-bottom">
              <span id="phase">待命</span>
              <span class="divider">|</span>
              <span id="progress">0/0</span>
            </div>
          </div>
        </div>

        <div class="dock-center">
          <button id="calibration">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
            收集
          </button>
          <button id="train">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
            訓練
          </button>
          <button id="test">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
            測試
          </button>
          <button id="btnFullscreen" class="btn-icon-only" title="全螢幕" aria-label="切換全螢幕">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
          </button>
        </div>

        <div class="dock-right">
          <button id="toggle-settings" class="dock-icon-btn" title="模型中心">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </button>

        </div>

        <div id="logsTray" class="dock-tray hidden">
          <h3>系統紀錄</h3>
          <pre id="log" aria-live="polite">載入中...</pre>
        </div>
      </section>
    </main>

    <div id="collectModal" class="modal-overlay hidden">
      <div class="modal-card">
        <div class="modal-header">
          <h3>收集設定</h3>
          <button class="modal-close" id="closeCollect">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="modal-body">
          <div class="field">
            <label for="participantName">受試者 ID</label>
            <input id="participantName" value="anonymous" placeholder="e.g. wenson" autocomplete="off" />
          </div>
          <div class="field">
            <label for="collectMode">收集模式</label>
            <select id="collectMode" class="tray-select">
              <option value="standard">13 點標準校正</option>
              <option value="four_corners">四角快速校正</option>
              <option value="motion_robust">動作強健校正（5 姿勢 × 13 點）</option>
            </select>
            <small style="display: block; margin-top: 6px; color: var(--ink-secondary); line-height: 1.45;">
              動作強健模式會在正面、左轉、右轉、近距與遠距重複相同目標，共至少 65 筆。
            </small>
          </div>
          <div class="field-row">
            <div class="field">
              <label for="repeatCount">重複次數</label>
              <input id="repeatCount" type="number" min="1" max="8" value="1" />
            </div>
            <div class="field">
              <label for="delayTime">延遲 (ms)</label>
              <input id="delayTime" type="number" min="300" max="5000" step="100" value="900" />
            </div>
          </div>
          <div class="field" style="margin-top: 8px;">
            <label class="checkbox-container">
              <input type="checkbox" id="recordVideo" checked />
              <span class="chk-lbl">同時錄製影片（保存完整影片與時間軸）</span>
            </label>
          </div>
          <div style="border-top: 1px solid var(--line); margin: 16px 0; padding-top: 16px;">
            <label style="font-size: 13px; font-weight: 600; margin-bottom: 8px; display: block; color: var(--ink-primary);">離線影片批次校正</label>
            <div class="field">
              <label for="uploadVideoFile">選擇校正影片 (.webm, .mp4)</label>
              <input id="uploadVideoFile" type="file" accept="video/*" style="min-height: auto; padding: 4px;" />
            </div>
            <div class="field" style="margin-top: 8px;">
              <label for="uploadTimelineFile">選擇時間軸 JSON</label>
              <input id="uploadTimelineFile" type="file" accept=".json" style="min-height: auto; padding: 4px;" />
            </div>
            <button id="btnUploadOffline" class="btn-primary" style="margin-top: 12px; width: 100%; min-height: 36px; font-size: 13px;">
              執行離線影片校正
            </button>
          </div>
        </div>
        <div class="modal-footer">
          <button id="btnCancelCollect" class="btn-secondary">取消</button>
          <button id="btnStartCollect" class="btn-primary">開始</button>
        </div>
      </div>
    </div>

    <div id="trainModal" class="modal-overlay hidden">
      <div class="modal-card">
        <div class="modal-header">
          <h3>訓練個人化模型</h3>
          <button class="modal-close" id="closeTrain">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="modal-body">
          <div class="field">
            <label for="selectDataset">資料集</label>
            <select id="selectDataset" class="tray-select"></select>
          </div>
          <div class="field">
            <label for="selectBaseModel">基礎模型</label>
            <select id="selectBaseModel" class="tray-select">
              <option value="0">從頭訓練</option>
            </select>
          </div>
          <div class="field">
            <label for="outputModelName">模型名稱</label>
            <input id="outputModelName" value="anonymous_model" placeholder="e.g. my_gaze_model" autocomplete="off" />
          </div>
        </div>
        <div class="modal-footer">
          <button id="btnCancelTrain" class="btn-secondary">取消</button>
          <button id="btnStartTrain" class="btn-primary">訓練</button>
        </div>
      </div>
    </div>

    <div id="modelsModal" class="modal-overlay hidden">
      <div class="modal-card">
        <div class="modal-header">
          <h3>模型中心</h3>
          <button class="modal-close" id="closeModels">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="modal-body">
          <p class="modal-sub">資料集 (<code>data/sessions/</code>)：</p>
          <div class="models-list" id="datasetsList"></div>
          <p class="modal-sub" style="margin-top:12px">個人化模型 (<code>runs/</code>)：</p>
          <div class="models-list" id="modelsList">
            <div class="empty-list">尚無模型，請先訓練。</div>
          </div>
        </div>
        <div class="modal-footer">
          <button id="btnCloseModels" class="btn-secondary">關閉</button>
        </div>
      </div>
    </div>

    <div id="renameDialog" class="modal-overlay hidden">
      <div class="modal-card" style="max-width:340px">
        <div class="modal-header">
          <h3>重新命名</h3>
          <button class="modal-close" id="closeRename">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="modal-body">
          <div class="field">
            <label for="renameInput">新名稱</label>
            <input id="renameInput" type="text" autocomplete="off" />
          </div>
        </div>
        <div class="modal-footer">
          <button id="btnCancelRename" class="btn-secondary">取消</button>
          <button id="btnConfirmRename" class="btn-primary">確定</button>
        </div>
      </div>
    </div>
    <a id="backLink" href="/">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      返回
    </a>
    <script src="/static/gaze_page.js"></script>
  </body>
</html>
